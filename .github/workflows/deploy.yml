name: 🧪 Tests
on:
  push:
    branches:
      - main
      - dev
  pull_request: {}
permissions:
  actions: write
  contents: read

jobs:
  lint:
    name: ⬣ ESLint
    runs-on: ubuntu-latest
    steps:
      - name: 🛑 Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.0

      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4.2.0

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          check-latest: true
          cache: "pnpm"

      - name: 📥 Download deps
        run: pnpm install --ignore-scripts --no-frozen-lockfile

      - name: 🔬 Lint
        run: pnpm run lint

  typecheck:
    name: ʦ TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: 🛑 Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.0

      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4.2.0

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          check-latest: true
          cache: "pnpm"

      - name: 📥 Download deps
        run: pnpm install --no-frozen-lockfile

      - name: 👷 Build the publishable packages
        run: pnpm run build:packages

      - name: 🔎 Type check
        run: pnpm run typecheck

  vitest:
    name: ⚡ Vitest
    runs-on: ubuntu-latest
    steps:
      - name: 🛑 Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.0

      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4.2.0

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          check-latest: true
          cache: "pnpm"

      - name: 📥 Download deps
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: ⚡ Run vitest
        run: pnpm run test

  pack:
    name: 📦 Pack
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          check-latest: true
          cache: "pnpm"

      - name: 📥 Download deps
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: 👷 Build the publishable packages
        run: pnpm run build:packages

      - name: 📦 Check what would be published
        run: pnpm run check:pack
