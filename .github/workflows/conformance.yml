name: 🔁 Conformance (live Ghost)
on:
  pull_request:
    branches:
      - main
    # Only what the suite runs on.
    paths:
      - "packages/ghost-conformance/**"
      - "packages/ts-ghost-admin-api/**"
      - "packages/ts-ghost-content-api/**"
      - "packages/ts-ghost-core-api/**"
      - "packages/tsconfig/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/conformance.yml"
  push:
    branches:
      - main
    paths:
      - "packages/ghost-conformance/**"
      - "packages/ts-ghost-admin-api/**"
      - "packages/ts-ghost-content-api/**"
      - "packages/ts-ghost-core-api/**"
      - "packages/tsconfig/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/conformance.yml"
  workflow_dispatch: {}
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    # Each leg runs one Ghost image from packages/ghost-conformance/ghost-versions.json with one schema target.
    name: 👻 Live suite (${{ matrix.leg }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: v5 # last Ghost 5, compat target
          - leg: v6.0 # Ghost 6.0.0, compat target
          - leg: pin # pinned Ghost 6, latest target
    defaults:
      run:
        working-directory: packages/ghost-conformance
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A PR's merge commit and its parents, for the manifest test's diff.
          fetch-depth: 2

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          check-latest: true
          cache: "pnpm"

      - name: 📥 Download deps
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The pin always. The other legs only when the manifest code changed; on a push, or if the diff fails, too.
      - name: 🔎 Run the manifest test on this leg?
        id: manifest
        run: |
          if [ "$LEG" != pin ] && [ "$EVENT" = pull_request ] && git diff --quiet HEAD^1 HEAD -- src/manifest/; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          LEG: ${{ matrix.leg }}
          EVENT: ${{ github.event_name }}

      - name: 🧪 Live conformance suite
        run: pnpm test:live --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/reports/live.xml"
        env:
          GHOST_LEG: ${{ matrix.leg }}

      # After the live suite, so the two Ghosts never run at once.
      - name: 🗺️ Manifest generation test
        if: ${{ !cancelled() && steps.manifest.outputs.run == 'true' }}
        run: pnpm test:manifest --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/reports/manifest.xml"
        env:
          GHOST_LEG: ${{ matrix.leg }}

      - name: 📦 Keep the test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-reports-${{ matrix.leg }}
          path: ${{ runner.temp }}/reports/
          if-no-files-found: ignore
          retention-days: 14
