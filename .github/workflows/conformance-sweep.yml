# The compat leg against Ghost minors between 6.0 and the pin, on PRs that touch the schemas or the pin and by hand,
# so "compat parses every 6.x" rests on evidence. A failure is a missing line in compat.ts or the content schemas.
name: 🔁 Conformance compat sweep (Ghost 6 minors)
on:
  pull_request:
    branches:
      - main
      - ci-base-d
    paths:
      - "packages/ts-ghost-admin-api/src/schemas/**"
      - "packages/ts-ghost-content-api/src/**"
      - "packages/ts-ghost-core-api/src/schemas/**"
      - "packages/ghost-conformance/ghost-versions.json"
  workflow_dispatch:
    inputs:
      ghost-versions:
        description: "Comma-separated Ghost versions, e.g. 6.20.0,6.40.0 (default: 6.10, 6.28, 6.30, 6.50, 6.60 and the minor before the pin)"
        type: string
        required: false
        default: ""
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: 🔎 Ghost versions to sweep
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A PR's merge commit and its parents: the first parent holds the base branch's pin.
          fetch-depth: 2

      # The PR's pin and the inputs are untrusted: env only, and every version must pass the check below.
      - name: 📋 List them
        id: list
        env:
          REQUESTED: ${{ inputs.ghost-versions }}
          EVENT: ${{ github.event_name }}
        run: |
          node -e '
            const { execSync } = require("node:child_process");
            const file = "packages/ghost-conformance/ghost-versions.json";
            const { pin } = require(`./${file}`);
            const [major, minor] = pin.split(".").map(Number);
            const requested = (process.env.REQUESTED || "").split(",").map((v) => v.trim()).filter(Boolean);
            // A drift PR can jump several minors, so the minor before its pin can miss the old pin.
            const basePin = process.env.EVENT === "pull_request" ? [JSON.parse(execSync(`git show HEAD^1:${file}`)).pin] : [];
            const versions = requested.length
              ? requested
              : ["6.10.0", "6.28.0", "6.30.0", "6.50.0", "6.60.0", `${major}.${minor - 1}.0`, ...basePin];
            if (!versions.every((v) => /^6\.\d+\.\d+$/.test(v))) throw new Error(`Not Ghost 6 versions: ${versions}`);
            console.log(`versions=${JSON.stringify([...new Set(versions)])}`);
          ' >> "$GITHUB_OUTPUT"

  sweep:
    name: 👻 Compat leg on Ghost ${{ matrix.version }}
    needs: versions
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.versions) }}
    defaults:
      run:
        working-directory: packages/ghost-conformance
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          check-latest: true
          cache: "pnpm"

      - name: 📥 Download deps
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The live suite skips a test for a route this Ghost lacks, which it reads from the Ghost's manifest.
      - name: 🗺️ Generate the manifest of Ghost ${{ matrix.version }}
        run: pnpm manifest "$GHOST_VERSION"
        env:
          GHOST_VERSION: ${{ matrix.version }}

      - name: 🧪 Live suite, compat target
        run: pnpm test:live --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/reports/live.xml"
        env:
          GHOST_LEG: v6.0
          GHOST_LEG_VERSION: ${{ matrix.version }}

      - name: 📦 Keep the test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-sweep-${{ matrix.version }}
          path: ${{ runner.temp }}/reports/
          if-no-files-found: ignore
          retention-days: 14
